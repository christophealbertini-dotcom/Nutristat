name: PulseLab Watch Connector Android APK
on:
  push:
    branches:
      - build/pulselab-watch-connector-v05
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Clone protocol implementation
        run: |
          git clone https://github.com/judas-priest/pedometer.git connector
          cd connector
          git checkout 9bf62fbc5ebd74a51605196e2367c8baf04d3cb3
      - name: Apply PulseLab independent export adapter
        run: python3 builder/apply_patch.py connector
      - name: Apply safe sequential watch sync and diagnostics
        run: python3 builder/patch_sync.py connector
      - name: Apply v0.4 timeout, ACK and diagnostic log fixes
        run: python3 builder/patch_v04.py connector
      - name: Add offline Xiaomi archive importer
        run: python3 builder/patch_archive_v05.py connector
      - name: Compile APK
        working-directory: connector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseLab-WatchConnector-FR-v05-Xiaomi-Archive
          path: connector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish directly downloadable public APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp connector/app/build/outputs/apk/debug/app-debug.apk PulseLab_WatchConnector_FR_v05_Import_Xiaomi.apk
          sha256sum PulseLab_WatchConnector_FR_v05_Import_Xiaomi.apk
          gh release create "pulselab-watch-connector-v0.5-fr"             "PulseLab_WatchConnector_FR_v05_Import_Xiaomi.apk"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Pulse Lab Watch Connector v0.5 FR – Import Xiaomi + Bluetooth"             --notes "Version d'essai Android : Bluetooth direct + import local d'archives officielles Mi Fitness ZIP/CSV (hlth_center_sport_record). Aucun accès au compte Xiaomi dans l'application ; export historique à demander via account.xiaomi.com. Pas de garantie de GPS dans le CSV. Les fichiers sont stockés localement sous Téléchargements/PulseLab/WatchInbox/MiFitnessImport."             --prerelease
