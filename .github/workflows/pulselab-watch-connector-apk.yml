name: PulseLab Watch Connector Android APK
on:
  push:
    branches:
      - build/pulselab-watch-connector-v11
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Clone protocol implementation
        run: |
          git clone https://github.com/judas-priest/pedometer.git connector
          cd connector
          git checkout 9bf62fbc5ebd74a51605196e2367c8baf04d3cb3
      - name: Apply PulseLab independent export adapter
        run: python3 builder/apply_patch.py connector
      - name: Apply safe sequential watch sync and diagnostics
        run: python3 builder/patch_sync.py connector
      - name: Apply v0.4 timeout, ACK and diagnostic log fixes
        run: python3 builder/patch_v04.py connector
      - name: Apply experimental archive listing probe (v0.6)
        run: python3 builder/patch_v06.py connector
      - name: Add protected historical workout re-fetch (v0.7)
        run: python3 builder/patch_v07.py connector
      - name: Repair Mi Fitness importer and diagnostic sharing (v0.8)
        run: python3 builder/patch_v08.py connector
      - name: "v1.1 sport-only no-ACK from v0.8 transfer engine"
        run: python3 builder/patch_v11.py connector
      - name: Compile APK
        working-directory: connector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseLab-WatchConnector-FR-v11-v08Sport-NoACK
          path: connector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish directly downloadable APK from GitHub
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp connector/app/build/outputs/apk/debug/app-debug.apk PulseLab_WatchConnector_FR_v11_Moteur_v08_Sports_Sans_ACK.apk
          sha256sum PulseLab_WatchConnector_FR_v11_Moteur_v08_Sports_Sans_ACK.apk
          gh release create "pulselab-watch-connector-v1.1-fr" "PulseLab_WatchConnector_FR_v11_Moteur_v08_Sports_Sans_ACK.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PulseLab Watch v1.1 FR - moteur v0.8 sports sans ACK" --notes "Back to working v0.8 Bluetooth activity file receiver validated on a 3-file workout + GPS. New manual SPORT-ONLY listing filter skips daily files; no ACK (type 8/subtype 5) is ever sent. No alternate archive probes or replay attempts. After finishing, manually disconnect Pulse Lab before opening Mi Fitness. Separate app ID; configure credentials again. EXPERIMENTAL: verify same new workout is recovered by both apps." --prerelease
