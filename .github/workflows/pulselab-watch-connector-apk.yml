name: PulseLab Watch Connector Android APK
on:
  push:
    branches:
      - build/pulselab-watch-connector-v01
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build adapter
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        run: |
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Clone protocol implementation
        run: |
          git clone https://github.com/judas-priest/pedometer.git connector
          cd connector
          git checkout 9bf62fbc5ebd74a51605196e2367c8baf04d3cb3
      - name: Apply PulseLab independent export adapter
        run: python3 builder/apply_patch.py connector
      - name: Compile APK
        working-directory: connector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseLab-WatchConnector-AutoSync-Android15
          path: connector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
