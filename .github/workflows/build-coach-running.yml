name: Coach Running 0.4 - APK Android
on:
  push:
    branches: [ coach-running-mvp ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer la base Android
        shell: bash
        run: |
          mkdir -p coach-running
          cat coach-parts/part-*.b64 | base64 --decode > coach-running-base.tar.xz
          echo "20c2a10065cacb2b2ef87a85ddb17aec597a38105beb7bd5337dc31e6d07d600  coach-running-base.tar.xz" | sha256sum -c -
          tar -xJf coach-running-base.tar.xz -C coach-running
      - name: Appliquer le module 0.2 - imports et historique
        shell: bash
        run: |
          cat coach-v02-parts/part-*.b64 | base64 --decode > coach-running-v02.tar.xz
          echo "3f3030b50f0a131dffa63fd3d67f52fd58def3d6ea8847af081e33640988ecb9  coach-running-v02.tar.xz" | sha256sum -c -
          tar -xJf coach-running-v02.tar.xz -C coach-running
          patch --batch -d coach-running -p1 < coach-running/native.patch
          sed -i 's/base\*Math.pow(1.08,w)/base*Math.min(2.2,Math.pow(1.055,w))/' coach-running/app/src/main/assets/app.js
      - name: Appliquer le module 0.3 - entraînements et analyses
        shell: bash
        run: |
          mkdir -p /tmp/coach03
          cat coach-v03-parts/part-*.b64 | base64 --decode > coach-running-v03.tar.xz
          echo "d32407f24e18c130aa9f0da66caa04b7ae043c49be541898fad74be700b0dd43  coach-running-v03.tar.xz" | sha256sum -c -
          tar -xJf coach-running-v03.tar.xz -C /tmp/coach03
          patch --batch -d coach-running -p1 < /tmp/coach03/native03.patch
          cp /tmp/coach03/training.js coach-running/app/src/main/assets/training.js
      - name: Appliquer le module 0.4 - évaluation de niveau et types de séance
        shell: bash
        run: |
          base64 --decode coach-v04/level04.js.gz.b64 > /tmp/coach04.js.gz
          echo "670075d5d300874bab6087e77f2159585af744e1d038aa5140a5d5ae7f4a9c48  /tmp/coach04.js.gz" | sha256sum -c -
          gzip -dc /tmp/coach04.js.gz > coach-running/app/src/main/assets/level04.js
          base64 --decode coach-v04/index.html.gz.b64 > /tmp/coach04.html.gz
          echo "600c5891b177b24f87a45338dc3525de8ea3f2b112cb776e417d5d10f668d650  /tmp/coach04.html.gz" | sha256sum -c -
          gzip -dc /tmp/coach04.html.gz > coach-running/app/src/main/assets/index.html
          sed -i "s/versionCode 1/versionCode 4/;s/versionName '0.1.0'/versionName '0.4.0'/" coach-running/app/build.gradle
          node --check coach-running/app/src/main/assets/level04.js
          grep -q 'level04.js' coach-running/app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "y" | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler l'APK de test
        run: gradle -p coach-running --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CoachRunning-v0.4-APK
          path: coach-running/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CoachRunning-v0.4-Source
          path: coach-running/
          if-no-files-found: error
