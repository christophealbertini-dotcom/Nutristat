name: Build Aventure CE1 APK

on:
  push:
    branches: ["aventure-ce1-apk", "aventure-ce1-final-graphics2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependency
        run: python3 -m pip install --user pillow
      - name: Build approved graphic atlas
        run: |
          mkdir -p aventure-ce1/app/src/main/res/drawable-nodpi
          base64 --decode aventure-ce1/art/atlas_final.b64 > /tmp/final_charter.jpg
          python3 - <<'PY'
          from PIL import Image
          src='/tmp/final_charter.jpg'
          dst='aventure-ce1/app/src/main/res/drawable-nodpi/final_charter.jpg'
          im=Image.open(src).convert('RGB')
          assert im.size==(768,512), im.size
          im=im.resize((1536,1024), Image.Resampling.BICUBIC)
          im.save(dst, 'JPEG', quality=92, optimize=True)
          chk=Image.open(dst)
          assert chk.size==(1536,1024)
          chk.verify()
          print('approved atlas ready')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: aventure-ce1
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp aventure-ce1/app/build/outputs/apk/debug/app-debug.apk Aventure-CE1-Finale-Graphique.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aventure-CE1-Finale-Graphique
          path: Aventure-CE1-Finale-Graphique.apk
          if-no-files-found: error
