name: Build Aventure CE1 APK

on:
  push:
    branches: ["aventure-ce1-apk", "aventure-ce1-final-graphics2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble approved graphic charter
        run: |
          mkdir -p aventure-ce1/app/src/main/res/drawable-nodpi
          cat aventure-ce1/art/final_charter.part{1..8} | tr -cd 'A-Za-z0-9+/=' > /tmp/final_charter.b64
          base64 --decode /tmp/final_charter.b64 > aventure-ce1/app/src/main/res/drawable-nodpi/final_charter.webp
          file aventure-ce1/app/src/main/res/drawable-nodpi/final_charter.webp
          python3 - <<'PY'
          from PIL import Image
          p='aventure-ce1/app/src/main/res/drawable-nodpi/final_charter.webp'
          im=Image.open(p); im.verify()
          print('approved atlas verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: aventure-ce1
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp aventure-ce1/app/build/outputs/apk/debug/app-debug.apk Aventure-CE1-Finale-Graphique.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aventure-CE1-Finale-Graphique
          path: Aventure-CE1-Finale-Graphique.apk
          if-no-files-found: error
