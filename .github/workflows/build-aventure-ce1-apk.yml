name: Build Aventure CE1 APK

on:
  push:
    branches: ["aventure-ce1-apk", "aventure-ce1-final-graphics2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: aventure-ce1
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp aventure-ce1/app/build/outputs/apk/debug/app-debug.apk Aventure-CE1-Finale-Graphique.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aventure-CE1-Finale-Graphique
          path: Aventure-CE1-Finale-Graphique.apk
          if-no-files-found: error
      - name: Package Android signing tools
        run: |
          mkdir -p signer/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signer/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signer/lib/
          chmod +x signer/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: signer
          if-no-files-found: error
