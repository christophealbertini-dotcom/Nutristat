name: Build Aventure CE1 APK

on:
  push:
    branches: ["aventure-ce1-apk"]
    paths:
      - "aventure-ce1/**"
      - ".github/workflows/build-aventure-ce1-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final visual polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('aventure-ce1/app/src/main/java/com/aventurece1/game/MainActivity.java')
          s=p.read_text()
          s=s.replace('l.setBackground(grad(top,bottom,0));return l;}','l.setBackground(new PlaygroundDrawable(top==c("#40C7F3")));return l;}')
          s=s.replace('l.setBackground(shape(c("#FFF8D8"),c("#F0A51A"),20,3));LinearLayout.LayoutParams','l.setBackground(shape(c("#FFF8D8"),c("#F0A51A"),20,3));l.setElevation(dp(9));LinearLayout.LayoutParams')
          s=s.replace('x.setBackground(g);LinearLayout.LayoutParams','x.setBackground(g);x.setElevation(dp(8));LinearLayout.LayoutParams')
          s=s.replace('void scenery(LinearLayout l){TextView deco=tx("☁️     🦋   ☀️   🦋     ☁️",19,c("#FFFFFF"));deco.setPadding(0,0,0,0);l.addView(deco);}','void scenery(LinearLayout l){Space sp=new Space(this);l.addView(sp,new LinearLayout.LayoutParams(1,dp(12)));}')
          s=s.replace('l.addView(img(R.drawable.rules_hero,210));','l.addView(img(R.drawable.rules_hero,250));')
          s=s.replace('heroV=img(R.drawable.heroes,135);','heroV=img(R.drawable.heroes,160);')
          s=s.replace('monsterV=img(monsterRes(),135);','monsterV=img(monsterRes(),160);')
          s=s.replace('l.addView(img(monsterRes(),180));','l.addView(img(monsterRes(),210));')
          s=s.replace('l.addView(img(R.drawable.victory_family,225));','l.addView(img(R.drawable.victory_family,255));')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: aventure-ce1
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp aventure-ce1/app/build/outputs/apk/debug/app-debug.apk Aventure-CE1-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aventure-CE1-test-apk
          path: Aventure-CE1-test.apk
          if-no-files-found: error
